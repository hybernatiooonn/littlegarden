      document.getElementById("readme-content").innerHTML =
        convertMarkdown(readmeMarkdown);

      function convertMarkdown(markdown) {
        const lines = markdown.replace(/\r/g, "").split("\n");
        const html = [];
        let paragraph = [];
        let listItems = [];

        function flushParagraph() {
          if (!paragraph.length) return;
          const text = paragraph.join(" ").trim();
          if (text) {
            html.push(`<p>${formatInline(text)}</p>`);
          }
          paragraph = [];
        }

        function flushList() {
          if (!listItems.length) return;
          html.push(
            `<ul>${listItems.map((item) => `<li>${formatInline(item)}</li>`).join("")}</ul>`,
          );
          listItems = [];
        }

        for (let i = 0; i < lines.length; i += 1) {
          const line = lines[i].trimEnd();
          const trimmed = line.trim();

          if (!trimmed) {
            flushParagraph();
            flushList();
            continue;
          }

          if (
            trimmed.startsWith("<details>") ||
            trimmed.startsWith("<summary>") ||
            trimmed.startsWith("</details>") ||
            trimmed.startsWith("</summary>") ||
            trimmed.startsWith("<strong>") ||
            trimmed.startsWith("</strong>") ||
            trimmed.startsWith("<img") ||
            trimmed.startsWith("<br>")
          ) {
            flushParagraph();
            flushList();
            html.push(line);
            continue;
          }

          if (trimmed.startsWith("## ")) {
            flushParagraph();
            flushList();
            html.push(`<h2>${formatInline(trimmed.slice(3))}</h2>`);
            continue;
          }

          if (trimmed.startsWith("# ")) {
            flushParagraph();
            flushList();
            html.push(`<h1>${formatInline(trimmed.slice(2))}</h1>`);
            continue;
          }

          if (trimmed.startsWith("- ")) {
            flushParagraph();
            listItems.push(trimmed.slice(2));
            continue;
          }

          if (trimmed.startsWith("> ")) {
            flushParagraph();
            flushList();
            html.push(
              `<blockquote>${formatInline(trimmed.slice(2))}</blockquote>`,
            );
            continue;
          }

          if (trimmed.startsWith("![")) {
            flushParagraph();
            flushList();
            const match = trimmed.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
            if (match) {
              html.push(`<img src="${match[2]}" alt="${match[1]}" />`);
            } else {
              html.push(`<p>${formatInline(trimmed)}</p>`);
            }
            continue;
          }

          if (trimmed.startsWith("---")) {
            flushParagraph();
            flushList();
            html.push("<hr>");
            continue;
          }

          paragraph.push(trimmed);
        }

        flushParagraph();
        flushList();

        return html.join("\n");
      }

      function formatInline(text) {
        let output = text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");

        output = output.replace(
          /!\[([^\]]*)\]\(([^)]+)\)/g,
          '<img src="$2" alt="$1" />',
        );
        output = output.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        output = output.replace(/\*([^*]+)\*/g, "<em>$1</em>");
        output = output.replace(
          /\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,
          '<a href="$2" target="_blank" rel="noreferrer">$1</a>',
        );
        output = output.replace(/`([^`]+)`/g, "<code>$1</code>");

        return output;
      }
